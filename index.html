<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de gradientes y jacobianos</title>
<meta name="description" content="Calcula gradientes y jacobianos de forma simbólica y verifícalos con diferencias finitas.">
<meta name="author" content="Ricardo Jaico Pradinett">
<!-- Aplica el tema guardado antes del primer pintado (ver comun/js/tema.js). -->
<script>try{var t=localStorage.getItem("tema");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="comun/css/tema.css">
<link rel="stylesheet" href="css/estilos.css">
<!-- `defer`: no bloquean el pintado y se ejecutan, en este orden, antes del módulo. -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<!-- El editor visual (MathLive) pesa más y no se carga aquí: lo pide js/ui/editor-visual.js
     después de pintar la página, para que abra rápido en móvil. -->
<script type="module" src="js/ui/app.js"></script>
</head>
<body>
<!--
  Los textos visibles salen del diccionario (js/i18n): cada elemento con
  data-i18n / data-i18n-html se rellena al arrancar. El título y la
  entradilla se dejan además escritos aquí para buscadores y vistas previas.
-->
<main>
  <div class="cabecera">
    <h1 data-i18n="pagina.titulo">Calculadora de gradientes y jacobianos</h1>
    <button type="button" id="tema" class="boton-tema"></button>
  </div>
  <p class="lead" data-i18n="pagina.entradilla">Deriva simbólicamente, evalúa en un punto y comprueba el resultado con diferencias finitas centradas.</p>

  <section class="card" aria-labelledby="tituloFunciones">
    <div class="cabecera">
      <h2 id="tituloFunciones" data-i18n="entrada.funciones"></h2>
      <div class="modo" role="group" data-i18n-aria-label="comun.modo">
        <button type="button" id="modoVisual" data-i18n="comun.modo.visual" aria-pressed="true"></button>
        <button type="button" id="modoCodigo" data-i18n="comun.modo.codigo" aria-pressed="false"></button>
      </div>
    </div>
    <p class="hint" data-i18n="entrada.funciones.ayuda"></p>
    <p id="avisoModo" class="aviso" role="status" hidden></p>

    <ol id="funciones" class="funciones"></ol>
    <button type="button" id="agregar" class="secundario" data-i18n="entrada.funcion.agregar"></button>

    <h3 data-i18n="entrada.vistaPrevia"></h3>
    <div id="vistaPrevia" class="math vista-previa"></div>

    <h3 id="tituloPunto" data-i18n="entrada.punto"></h3>
    <p class="hint" data-i18n-html="entrada.punto.ayuda"></p>
    <div id="valores" class="valores" role="group" aria-labelledby="tituloPunto"></div>

    <!-- Con el teclado en pantalla abierto, esta barra se queda justo encima (comun/css/tema.css). -->
    <div class="barra-accion">
      <button class="primary" id="calc" type="button" data-i18n="entrada.calcular"></button>
    </div>

    <h3 data-i18n="entrada.ejemplos"></h3>
    <div id="examples" class="ejemplos"></div>

    <details>
      <summary class="muted" data-i18n="entrada.opciones"></summary>
      <label for="orden" data-i18n="entrada.orden"></label>
      <input id="orden" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="ordenAyuda ordenError">
      <p id="ordenAyuda" class="hint" data-i18n-html="entrada.orden.ayuda"></p>
      <p id="ordenError" class="error-fila" hidden></p>
      <h3 data-i18n="entrada.sintaxis.titulo"></h3>
      <p class="muted" data-i18n-html="entrada.sintaxis.texto"></p>
    </details>
  </section>

  <div id="error" class="error" role="alert" hidden></div>

  <section id="results" hidden>
    <div class="barra-resultados">
      <label for="precision" data-i18n="resultado.precision"></label>
      <select id="precision"></select>
    </div>

    <div class="card">
      <div class="cabecera">
        <h2 id="symTitle"></h2>
        <div class="acciones">
          <button type="button" class="copiar" data-copia="simbolico" data-i18n="resultado.copiarLatex"></button>
        </div>
      </div>
      <div id="sym" class="math"></div>
    </div>

    <div class="card">
      <div class="cabecera">
        <h2 id="valTitle"></h2>
        <div class="acciones">
          <button type="button" class="copiar" data-copia="valor" data-i18n="resultado.copiarLatex"></button>
          <button type="button" class="copiar" data-copia="valores" data-i18n="resultado.copiarValores"></button>
        </div>
      </div>
      <div id="val" class="math"></div>
      <div id="extra" class="math"></div>
    </div>

    <div class="card">
      <div class="cabecera">
        <h2 data-i18n="resultado.verificacion"></h2>
        <div class="acciones">
          <button type="button" class="copiar" data-copia="numericos" data-i18n="resultado.copiarValores"></button>
        </div>
      </div>
      <div id="num" class="math"></div>
      <div id="dif" class="math"></div>
      <p><span id="badge" class="badge"></span></p>
      <p class="muted">
        <span data-i18n="resultado.explicacion.antes"></span>
        <span id="fdFormula"></span>
        <span data-i18n="resultado.explicacion.paso"></span>
        <span id="pasoFormula"></span><span data-i18n="resultado.explicacion.criterio"></span>
      </p>
      <div id="criterio" class="math"></div>
      <p class="muted" data-i18n="resultado.explicacion.despues"></p>
    </div>

    <!-- Aviso para lectores de pantalla al copiar. -->
    <p id="avisoCopia" class="solo-lectores" role="status"></p>
  </section>

  <footer data-i18n-html="pie.texto"></footer>
</main>
</body>
</html>
