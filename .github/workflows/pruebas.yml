name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    name: Calculadora (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  python:
    name: Ejercicios (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - run: pytest ejercicios/tests
